services:
  - type: web
    name: cricketverse-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3001
      - key: MONGO_URI
        sync: false
      - key: CRICKET_DATA_API_KEY
        sync: false
      - key: VISUAL_CROSSING_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: CRICKET_DATA_ENDPOINT
        value: matches
      - key: CRICKET_DATA_SOURCE
        value: live
      - key: LIVE_MATCH_CACHE_MINUTES
        value: 60
      - key: DATA_RETENTION_DAYS
        value: 30
      - key: NEWS_CACHE_MINUTES
        value: 60
      - key: DAY_REFRESH_INTERVAL_MINUTES
        value: 20
      - key: NIGHT_REFRESH_INTERVAL_MINUTES
        value: 60
      - key: DAY_REFRESH_START_HOUR
        value: 8
      - key: NIGHT_REFRESH_START_HOUR
        value: 23
      - key: CRICKET_DATA_TIMEZONE
        value: Asia/Kolkata

  - type: web
    name: cricketverse-prediction
    runtime: python
    rootDir: prediction
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn predict_server:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: cricketverse-toss-advisor
    runtime: python
    rootDir: prediction
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn decision_advisor:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
